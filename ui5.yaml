specVersion: "3.0"
metadata:
  name: po-history
type: application
framework:
  name: SAPUI5
  version: "1.71.84"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ushell
    - name: sap.ndc
    # sap.ca.ui is retained from the legacy app (message box / amount format helpers).
    # Validate availability on the 1.71.84 target runtime before go-live.
    - name: sap.ca.ui
      optional: true
    - name: themelib_sap_fiori_3
builder:
  resources:
    excludes:
      - /test/**
      - /localIndex.html
  cachebuster:
    signatureType: hash
